# PostgreSQL Backup Configuration



source:
# Database name to backup
  database_name: dvdrental
# Directory where backups will be stored
  backup_dir: ~/backup
# PostgreSQL user
  pg_user: postgres
# PostgreSQL port
  port: 5432
# PostgreSQL host
  host: localhost
# Backup format: c (custom), t (tar), p (plain), d (directory)
  backup_format: d

target:
  host: 192.168.1.245 # Target host for backup (can be the same as source)
  user: admin # SSH user for target host
  port: 9543 # SSH port for target host
  path: /home/admin/backups/remote # Directory on target host where backup will be stored
  ssh_keys: ~/.ssh/id_rsa # Path to SSH private key for authenticationk